        body:
          data: '{{#1000000000007.save_body#}}'
          type: raw-text
        default_value:
        - key: body
          type: string
          value: ''
        - key: status_code
          type: number
          value: 0
        desc: 显式保存案卷；写操作禁止自动重试，避免超时后重复建档。
        error_strategy: default-value
        headers: |-
