    nodes:
    - data:
        desc: 玩家编号用于查找同一玩家的历史案卷；当前消息通过 sys.query 传入。
        selected: false
        title: 玩家入场
        type: start
        variables:
        - type: text-input
          label: 玩家编号
          variable: player_id
          max_length: 32
          required: true
          hint: 1–32 位字母、数字、下划线或连字符，例如 player001；跨会话保持不变。
      height: 90
      id: '1000000000001'
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re


          def main(raw_player_id, query, scope_id):
              player_id = (raw_player_id or "").strip()
              excuse = (query or "").strip()
              error = ""
              if not re.fullmatch(r"[A-Za-z0-9_-]{1,32}", player_id):
                  error = "玩家编号须为 1–32 位字母、数字、下划线或连字符。"
              elif not excuse or len(excuse) > 500:
                  error = "辩解须为 1–500 字。"
              elif not (scope_id or "").strip():
                  error = "尚未配置 POWERCONTEXT_SCOPE_ID。"
              if error:
                  return {
                      "ok": 0,
                      "player_id": player_id,
                      "excuse": excuse,
                      "recall_body": "",
                      "error_message": error,
                  }
              recall_body = json.dumps(
                  {
                      "scope_id": scope_id.strip(),
                      "query": player_id,
                      "max_bytes": 6000,
                  },
                  ensure_ascii=False,
              )
              return {
                  "ok": 1,
                  "player_id": player_id,
                  "excuse": excuse,
                  "recall_body": recall_body,
                  "error_message": "",
              }
        code_language: python3
        desc: 校验输入，并用 JSON 序列化避免玩家输入破坏 HTTP 请求体。
        outputs:
          ok:
            children: null
            type: number
          player_id:
            children: null
            type: string
          excuse:
            children: null
            type: string
          recall_body:
            children: null
            type: string
          error_message:
            children: null
            type: string
        selected: false
        title: 校验并组装召回请求
