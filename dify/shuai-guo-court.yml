    - POWERCONTEXT_SERVER_URL
    value: http://127.0.0.1:8000
    value_type: string
  - description: 由 PowerContext Server 返回的 Scope ID；不是玩家编号。
    id: 7e6f2832-0d4a-4f0b-90db-1d6f40b6f002
