    - data:
        code: |-
          import json


          def main(status_code, body, player_id, verdict, charge, verdict_text, penalty, history_echo, repeat_offender, recall_note):
              try:
                  code = int(status_code or 0)
              except (TypeError, ValueError):
                  code = 0
              artifact_id = ""
              saved = 0
              if code in (200, 201):
                  try:
                      payload = json.loads(body or "")
                  except (TypeError, ValueError):
                      payload = None
                  records = payload.get("records") if isinstance(payload, dict) else None
                  if isinstance(records, list) and records:
                      artifact = records[0].get("artifact", {}) if isinstance(records[0], dict) else {}
                      if isinstance(artifact, dict):
                          artifact_id = str(artifact.get("artifact_id") or "")
                      saved = 1
              if saved:
                  archive_status = "案卷已写入 PowerContext，Artifact ID：`" + (artifact_id or "已返回记录") + "`。"
              else:
                  archive_status = "判决已生成，但案卷未确认写入；本庭不会声称保存成功。HTTP 状态：" + str(code) + "。"
              repeat_label = "再犯审理" if repeat_offender == 1 else "首案或独立审理"
              answer = (
                  "## 甩锅法庭 · 虚构判决\n\n"
                  "**玩家：** " + player_id + "　**审理方式：** " + repeat_label + "\n\n"
                  "**罪名：** " + charge + "\n\n"
                  "**判决：** " + verdict + "\n\n"
                  "> " + verdict_text + "\n\n"
                  "**虚构处罚：** " + penalty + "\n\n"
                  "### 历史回声\n" + history_echo + "\n\n"
                  "### 档案回执\n" + archive_status + "\n\n"
                  "召回说明：" + recall_note
              )
              return {
                  "answer": answer,
                  "archive_status": archive_status,
                  "artifact_id": artifact_id,
                  "saved": saved,
              }
