    opening_statement: |-
      欢迎来到甩锅法庭。输入玩家编号，再提交一段不超过 500 字的迟到、拖延或搞砸事情的辩解，NPC 法官会作出纯属娱乐的虚构判决。
      提交辩解即表示授权把本次虚构案卷保存到 PowerContext；新建会话后使用同一玩家编号，法官会翻旧案并按再犯处理。
      首案/再犯只由当前玩家自己的历史案卷决定，其他玩家的记录不参与判定；判决类别仍根据当前辩解生成。
